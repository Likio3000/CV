name: Site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -B -m unittest discover -s tests -v
      - run: node --check work-log.js
      - run: node --check snapshot.js
      - run: node --test tests/*.test.mjs

      - run: python3 -m pip install -r requirements-cv.txt
      - run: python3 scripts/check_cv_pdf.py
