<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Alex Bethune | Work Logs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css" data-cache-bust-style>
    <script>
      (function() {
        const styleLink = document.querySelector("[data-cache-bust-style]");
        if (styleLink) {
          styleLink.href = `styles.css?v=${Date.now()}`;
        }
      }());
    </script>
  </head>
  <body class="work-logs-page">
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <header class="site-header">
      <div class="brand">Alex Bethune</div>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html">CV</a>
        <a href="portfolio.html">Portfolio</a>
        <a class="active" href="work-logs.html">Work Logs</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-ghost" href="https://github.com/Likio3000" target="_blank" rel="noopener">
          View GitHub
        </a>
      </div>
    </header>

    <main>
      <section class="hero hero-slim">
        <div class="hero-text reveal">
          <p class="eyebrow">Cross-Project Activity</p>
          <h1>Work Logs</h1>
        </div>
      </section>

      <section class="log-feed reveal" data-work-log-list></section>
    </main>

    <script>
      (function() {
        const stamp = Date.now();

        function appendScript(src, onload) {
          const script = document.createElement("script");
          script.src = `${src}?v=${stamp}`;
          if (onload) {
            script.onload = onload;
          }
          document.body.appendChild(script);
        }

        appendScript("work-log-data.js", function() {
          appendScript("work-log.js");
        });
      }());
    </script>
  </body>
</html>
